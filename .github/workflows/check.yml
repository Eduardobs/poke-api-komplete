name: Verify PokeAPI compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pokeapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_USER: pokeapi
          POSTGRES_DB: pokeapi
          POSTGRES_PASSWORD: ci-local-snapshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokeapi -d pokeapi"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://pokeapi:ci-local-snapshot@localhost:5432/pokeapi
      HASURA_GRAPHQL_URL: http://localhost:18080/v1/graphql
      REFERENCE_GRAPHQL_URL: http://localhost:18080/v1/graphql
    steps:
      - uses: actions/checkout@v4
      # Resolve the key before installing dependencies inside vendor/pokeapi.
      # No fallback keys: SQLite and generated files must match all build inputs.
      - uses: actions/cache/restore@v4
        id: snapshot-cache
        with:
          path: |
            public
            src/generated
            vendor/pokeapi/db.sqlite3
            vendor/pokeapi/.snapshot-db-ready
          key: snapshot-v1-${{ runner.os }}-${{ runner.arch }}-py314-${{ hashFiles('vendor/**', 'scripts/**', 'data/**', 'contracts/graphql.schema.graphql', 'deploy/graphiql.html', 'upstream.lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.14'
      - run: uv sync --locked --no-dev --no-install-project
        working-directory: vendor/pokeapi
      - run: npm ci
      - run: npm run data:build
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        with:
          path: |
            public
            src/generated
            vendor/pokeapi/db.sqlite3
            vendor/pokeapi/.snapshot-db-ready
          key: ${{ steps.snapshot-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run audit:rest:full
      - run: npm run graphql:seed
      - name: Start official GraphQL engine with unchanged upstream metadata
        run: |
          docker build -f deploy/hasura/Dockerfile -t pokeapi-contract-graphql .
          docker run -d --name pokeapi-contract-graphql --network host \
            -e HASURA_GRAPHQL_DATABASE_URL="$DATABASE_URL" \
            -e HASURA_GRAPHQL_ADMIN_SECRET=ci-local-admin \
            -e HASURA_GRAPHQL_SERVER_PORT=18080 pokeapi-contract-graphql
          curl --retry 45 --retry-connrefused --retry-delay 2 --fail http://localhost:18080/healthz
      - run: npm run test:integration
      - run: npm run test:compatibility
      - run: npm run test:http
      - run: npm run benchmark
      - run: npm run benchmark:sql
      - run: npm run build
      - name: Build production backend after compatibility and performance gates
        run: |
          DOCKER_BUILDKIT=1 docker build -f deploy/backend/Dockerfile --target tested-snapshot -t pokeapi-own-backend .
          docker run -d --name pokeapi-own-backend --network host --memory=512m \
            -e DATABASE_URL="$DATABASE_URL" -e PORT=18081 pokeapi-own-backend
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:18081/healthz
          curl --fail http://localhost:18081/api/v2/pokemon/25/ -o /tmp/rest-smoke.json
          node -e "const x=require('/tmp/rest-smoke.json'); require('node:assert/strict').equal(x.id,25)"
          curl --fail http://localhost:18081/v1beta2 -H 'content-type: application/json' \
            --data '{"query":"{pokemon(where:{id:{_eq:25}}){id name}}"}' -o /tmp/graphql-smoke.json
          node -e "const x=require('/tmp/graphql-smoke.json'); require('node:assert/strict').equal(x.data.pokemon[0].name,'pikachu')"
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-and-performance
          path: |
            contracts/rest.audit.json
            contracts/backend.performance.json
            contracts/sql.performance.json
            contracts/backend.compatibility.json
      - name: Deploy tested Worker and snapshot to Cloudflare
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_WORKER_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRAPHQL_BACKEND_URL: ${{ secrets.GRAPHQL_BACKEND_URL }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'GRAPHQL_BACKEND_URL']) {
            if (!process.env[key]) throw new Error(`Configure the GitHub Actions secret ${key} before enabling deployment.`);
          }
          const backend = new URL(process.env.GRAPHQL_BACKEND_URL);
          if (backend.protocol !== 'https:') throw new Error('GRAPHQL_BACKEND_URL must use HTTPS in production.');
          writeFileSync(join(process.env.RUNNER_TEMP, 'cloudflare-worker-secrets.json'), JSON.stringify({
            GRAPHQL_BACKEND_URL: process.env.GRAPHQL_BACKEND_URL,
          }), { mode: 0o600 });
          JS
          trap 'rm -f "$RUNNER_TEMP/cloudflare-worker-secrets.json"' EXIT
          npm run deploy -- --secrets-file "$RUNNER_TEMP/cloudflare-worker-secrets.json" --var "CACHE_VERSION:${GITHUB_SHA}"
      - name: Hasura logs on failure
        if: failure()
        run: docker logs pokeapi-contract-graphql || true
      - name: Own backend logs on failure
        if: failure()
        run: docker logs pokeapi-own-backend || true
